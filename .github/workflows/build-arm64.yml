name: Build and Publish vlsi-toolbox Images (ARM64)

on:
  push:
    branches:
      - '**'
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-push-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: vlsi-toolbox
            dockerfile: ./docker/full/Dockerfile
            variant_suffix: ""
            cache_suffix: full
          - image_name: vlsi-toolbox-light
            dockerfile: ./docker/light/Dockerfile
            variant_suffix: "-light"
            cache_suffix: light
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Determine tags
      id: tags
      run: |
        REPO_OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        BASE_IMAGE="ghcr.io/${REPO_OWNER_LOWER}/${{ matrix.image_name }}"
        
        # Always include commit SHA tag
        TAGS="${BASE_IMAGE}:${{ github.sha }}-arm64"
        
        # Add release tag if this is a release event
        if [[ "${{ github.event_name }}" == "release" ]]; then
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          TAGS="${TAGS},${BASE_IMAGE}:${RELEASE_TAG}-arm64"
          TAGS="${TAGS},${BASE_IMAGE}:latest-arm64"
          if [[ -n "${{ matrix.variant_suffix }}" ]]; then
            TAGS="${TAGS},ghcr.io/${REPO_OWNER_LOWER}/vlsi-toolbox:${RELEASE_TAG}${{ matrix.variant_suffix }}-arm64"
            TAGS="${TAGS},ghcr.io/${REPO_OWNER_LOWER}/vlsi-toolbox:latest${{ matrix.variant_suffix }}-arm64"
          fi
        fi
        
        echo "tags=${TAGS}" >> $GITHUB_OUTPUT
        echo "base_image=${BASE_IMAGE}" >> $GITHUB_OUTPUT

    - name: Build and push ARM64 image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/arm64
        push: true
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=registry,ref=${{ steps.tags.outputs.base_image }}:buildcache-${{ matrix.cache_suffix }}-arm64
        cache-to: type=registry,ref=${{ steps.tags.outputs.base_image }}:buildcache-${{ matrix.cache_suffix }}-arm64,mode=max

    - name: Image digest
      run: |
        echo "ARM64 image (${{ matrix.image_name }}) pushed with tags: ${{ steps.tags.outputs.tags }}"
        docker buildx imagetools inspect ${{ steps.tags.outputs.base_image }}:${{ github.sha }}-arm64
